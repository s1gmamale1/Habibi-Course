<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="activeGradient" x1="150" y1="220" x2="215" y2="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer head, neck, and shoulders -->
    <path d="M180 50
             C220 52 278 82 310 130
             C332 164 308 196 280 210
             C266 235 290 314 330 390
             M140 390
             C152 338 154 282 170 240
             C150 236 128 230 110 220
             C95 214 84 211 80 205
             C75 198 72 193 72 188
             C60 184 48 176 46 165
             C54 156 66 141 70 112
             C76 88 92 72 112 65
             C134 56 155 50 180 50"
          stroke="#E8E6F2" stroke-opacity="0.4" stroke-width="2"/>

    <!-- Ear -->
    <path d="M216 138
             C236 144 244 166 236 186
             C229 204 208 208 198 191
             C188 174 195 148 216 138Z
             M213 154
             C223 160 225 177 215 187"
          stroke="#E8E6F2" stroke-opacity="0.35" stroke-width="1.5"/>

    <!-- Dimmed nasal passage: al-Khayshum -->
    <path d="M101 126
             C108 103 130 91 147 101
             C156 111 148 133 129 139
             C116 142 104 137 101 126Z"
          stroke="#E8E6F2" stroke-opacity="0.34" stroke-width="1.5" fill="#E8E6F2" fill-opacity="0.05"/>

    <!-- Dimmed oral cavity: al-Jawf -->
    <path d="M96 182
             C118 162 164 154 198 166
             C221 174 225 202 207 221
             C188 241 143 237 111 224
             C94 217 85 196 96 182Z"
          stroke="#E8E6F2" stroke-opacity="0.38" stroke-width="1.5" fill="#E8E6F2" fill-opacity="0.05"/>

    <!-- Dimmed tongue: al-Lisan -->
    <path d="M94 209
             C113 198 143 195 171 203
             C190 208 203 218 205 229
             C178 232 130 231 100 222
             C92 220 88 214 94 209Z"
          stroke="#E8E6F2" stroke-opacity="0.34" stroke-width="1.5" fill="#E8E6F2" fill-opacity="0.05"/>

    <!-- Dimmed lips: ash-Shafatan -->
    <path d="M61 185
             C70 177 84 177 93 185
             M60 203
             C72 210 87 208 94 199"
          stroke="#E8E6F2" stroke-opacity="0.42" stroke-width="1.6"/>
  </g>

  <!-- Active throat: al-Halq -->
  <path d="M171 221
           C190 219 209 232 214 252
           C219 275 212 309 196 329
           C182 344 160 331 155 306
           C149 280 154 246 171 221Z"
        fill="url(#activeGradient)" fill-opacity="0.68"
        stroke="#C9F7F2" stroke-width="1.6"
        stroke-linecap="round" stroke-linejoin="round"
        filter="url(#glow)"/>

  <g fill="none" stroke="#E8E6F2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M163 257 C176 263 195 263 210 257" stroke-opacity="0.35" stroke-width="1"/>
    <path d="M156 294 C171 301 192 301 207 292" stroke-opacity="0.3" stroke-width="1"/>
  </g>

  <!-- Label and leader -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <line x1="254" y1="262" x2="207" y2="267" stroke="#E8E6F2" stroke-opacity="0.5" stroke-width="1" stroke-linecap="round"/>
    <circle cx="207" cy="267" r="2" fill="#E8E6F2" fill-opacity="0.72"/>
    <text x="258" y="268" fill="#E8E6F2" font-size="17" font-weight="600">Throat — al-Halq</text>
  </g>
</svg>
