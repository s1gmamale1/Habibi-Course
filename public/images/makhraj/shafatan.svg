  <path d="M63 184 C72 176 88 180 96 191 C89 203 73 211 60 200 C66 199 77 197 84 192 C77 190 69 188 63 184 Z" fill="url(#activeGradient)" fill-opacity="0.68" stroke="#E8E6F2" stroke-opacity="0.82" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M66 199 C75 199 86 195 96 191" fill="none" stroke="#E8E6F2" stroke-opacity="0.75" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Label and leader. -->
